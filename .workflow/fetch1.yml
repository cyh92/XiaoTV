version: '1.0'
name: fetch1
displayName: fetch1
triggers:
  trigger: auto
  schedule:
    - cron: '* * */2 * * ? *'
stages:
  - name: fetchurl
    displayName: fetchurl
    strategy: naturally
    trigger: auto
    steps:
      - step: build@nodejs
        name: fetchurl
        displayName: fetchurl
        nodeVersion: 21.5.0
        commands:
          - npm install -g pnpm
          - pnpm install
        strategy:
          retry: '0'
      - step: build@nodejs
        name: build_nodejs
        displayName: WinBuild
        nodeVersion: 21.5.0
        commands:
          - pnpm electron:build:win
        strategy:
          retry: '0'
